name: Tests

on:
  pull_request:
  workflow_call:      # build.yml runs the fast tests before publishing an image (pull requests already ran everything)
  workflow_dispatch:  # run everything by hand
  schedule:
    - cron: '17 6 * * 1'  # every Monday, everything on main, so browser tests also cover changes that skipped them

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: pip install -r app/requirements.txt -r requirements-dev.txt

    - name: Run tests (API, readers, services)
      run: python -m pytest --ignore=tests/test_browser.py

  browser:
    name: Browser & accessibility
    # Not in the image build (github.workflow is the caller's name there)
    if: github.workflow == 'Tests'
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04). Move on when Playwright is upgraded.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # to compare a pull request with its base

    # On pull requests, only when pages, scripts, styles, routes or these tests change
    - name: Check what changed
      id: changes
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.base_ref }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        changed=$(git diff --name-only "origin/$BASE...HEAD")
        echo "$changed"
        if echo "$changed" | grep -qE '^(app/templates/|app/static/|app/api/routers/|app/requirements\.txt|requirements-dev\.txt|tests/(test_browser|conftest|pdfs)\.py|\.github/workflows/test\.yml)'; then
          echo "ui=true" >> "$GITHUB_OUTPUT"
        else
          echo "No page, script, style or route changes: browser tests skipped."
          echo "ui=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.changes.outputs.ui == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        cache: pip
        cache-dependency-path: |
          app/requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      if: steps.changes.outputs.ui == 'true'
      run: pip install -r app/requirements.txt -r requirements-dev.txt

    - name: Cache the browser
      if: steps.changes.outputs.ui == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

    # GitHub's Ubuntu runners already have Chromium's system libraries; apt is only used if one is missing
    - name: Install browser and accessibility checker
      if: steps.changes.outputs.ui == 'true'
      run: |
        python -m playwright install chromium
        python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()" \
          || python -m playwright install-deps chromium
        npm install --no-audit --no-fund --prefix tests/.node axe-core@4.10.2

    - name: Run browser tests
      if: steps.changes.outputs.ui == 'true'
      run: python -m pytest -n auto tests/test_browser.py
